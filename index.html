<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OnePort365 Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Open+Sans:wght@400;500;600;700&display=swap">
<style>
  /*
    Tokens sourced from the OnePort365 design system: deep green (#023819) for
    trust/structure, electric lime (#BFFB4F) reserved for the one primary action
    per view, gold for value/warning, red strictly for error. Poppins carries
    display/headings/key figures; Open Sans carries body, UI and dense data.
  */
  :root{
    --bg:#FDFBF1;
    --surface:#FFFFFF;
    --surface-2:#F4F6EF;
    --border:rgba(2,56,25,.12);
    --border-strong:#023819;
    --ink:#023819;
    --ink-soft:#383838;
    --muted:#808080;
    --link:#2f6b1e;
    --brand-fill:#023819;
    --input-border:rgba(2,56,25,.35);

    --sidebar:#023819;
    --sidebar-ink:#FDFBF1;
    --sidebar-muted:rgba(253,251,241,.62);
    --sidebar-hover:rgba(253,251,241,.08);
    --sidebar-active:#BFFB4F;
    --sidebar-active-ink:#023819;

    --accent:#BFFB4F;
    --accent-ink:#023819;
    --accent-strong:#a9e83a;
    --tint:#D1DBBD;
    --tint-ink:#023819;

    --amber-bg:#FFF3CC; --amber-ink:#8a6a00; --amber-dot:#FFCC1A;
    --green-bg:#E1F1E8; --green-ink:#0f7a45; --green-dot:#1F8A5B;
    --grey-bg:#EDEFE8; --grey-ink:#4a5a3f; --grey-dot:#808080;
    --red-bg:#FDE0E0; --red-ink:#cc1414; --red-dot:#FF1A1A;
    --lime-bg:#BFFB4F; --lime-ink:#023819; --lime-dot:#023819;

    --shadow-e1: 0 1px 2px rgba(2,56,25,.05), 0 1px 3px rgba(2,56,25,.04);
    --shadow-e2: 0 2px 4px rgba(2,56,25,.05), 0 8px 20px -8px rgba(2,56,25,.14);
    --shadow-e3: 0 4px 8px rgba(2,56,25,.06), 0 18px 40px -16px rgba(2,56,25,.22);
    --shadow:var(--shadow-e1);
    --radius:16px;
    --radius-sm:6px; --radius-md:8px; --radius-lg:12px; --radius-xl:16px;
    --font-ui: 'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-display: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: var(--font-display);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#081109;
      --surface:#0F1F14;
      --surface-2:#142A1B;
      --border:rgba(191,251,79,.14);
      --border-strong:#BFFB4F;
      --ink:#F2F7EC;
      --ink-soft:#C9D6C2;
      --muted:#8FA08A;
      --link:#a9e83a;
      --brand-fill:#1f5c33;
      --input-border:rgba(191,251,79,.35);

      --sidebar:#04140A;
      --sidebar-ink:#FDFBF1;
      --sidebar-muted:rgba(253,251,241,.55);
      --sidebar-hover:rgba(253,251,241,.08);
      --sidebar-active:#BFFB4F;
      --sidebar-active-ink:#023819;

      --accent:#BFFB4F;
      --accent-ink:#06210D;
      --accent-strong:#d4ff85;
      --tint:#223a28;
      --tint-ink:#EAF2E2;

      --amber-bg:#3A2C0A; --amber-ink:#FFD666; --amber-dot:#FFCC1A;
      --green-bg:#0F2E1C; --green-ink:#6FE3A6; --green-dot:#1F8A5B;
      --grey-bg:#1C2A1E; --grey-ink:#AAB8A2; --grey-dot:#8FA08A;
      --red-bg:#3A1210; --red-ink:#FF8A7A; --red-dot:#FF1A1A;
      --lime-bg:#2b3a12; --lime-ink:#D9FFA0; --lime-dot:#BFFB4F;

      --shadow-e1: 0 1px 2px rgba(0,0,0,.4), 0 1px 3px rgba(0,0,0,.3);
      --shadow-e2: 0 2px 4px rgba(0,0,0,.4), 0 8px 20px -8px rgba(0,0,0,.5);
      --shadow-e3: 0 4px 8px rgba(0,0,0,.45), 0 18px 40px -16px rgba(0,0,0,.6);
      --shadow:var(--shadow-e1);
    }
  }
  :root[data-theme="dark"]{
    --bg:#081109;
    --surface:#0F1F14;
    --surface-2:#142A1B;
    --border:rgba(191,251,79,.14);
    --border-strong:#BFFB4F;
    --ink:#F2F7EC;
    --ink-soft:#C9D6C2;
    --muted:#8FA08A;
    --link:#a9e83a;
    --brand-fill:#1f5c33;
    --input-border:rgba(191,251,79,.35);

    --sidebar:#04140A;
    --sidebar-ink:#FDFBF1;
    --sidebar-muted:rgba(253,251,241,.55);
    --sidebar-hover:rgba(253,251,241,.08);
    --sidebar-active:#BFFB4F;
    --sidebar-active-ink:#023819;

    --accent:#BFFB4F;
    --accent-ink:#06210D;
    --accent-strong:#d4ff85;
    --tint:#223a28;
    --tint-ink:#EAF2E2;

    --amber-bg:#3A2C0A; --amber-ink:#FFD666; --amber-dot:#FFCC1A;
    --green-bg:#0F2E1C; --green-ink:#6FE3A6; --green-dot:#1F8A5B;
    --grey-bg:#1C2A1E; --grey-ink:#AAB8A2; --grey-dot:#8FA08A;
    --red-bg:#3A1210; --red-ink:#FF8A7A; --red-dot:#FF1A1A;
    --lime-bg:#2b3a12; --lime-ink:#D9FFA0; --lime-dot:#BFFB4F;

    --shadow-e1: 0 1px 2px rgba(0,0,0,.4), 0 1px 3px rgba(0,0,0,.3);
    --shadow-e2: 0 2px 4px rgba(0,0,0,.4), 0 8px 20px -8px rgba(0,0,0,.5);
    --shadow-e3: 0 4px 8px rgba(0,0,0,.45), 0 18px 40px -16px rgba(0,0,0,.6);
    --shadow:var(--shadow-e1);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink-soft);
    font-family:var(--font-ui);
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:var(--font-display); font-weight:600; text-wrap:balance; margin:0; color:var(--ink);}
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--accent); color:var(--accent-ink);}
  .num{font-family:var(--font-display); font-weight:600; font-variant-numeric:tabular-nums;}

  /* App shell */
  .app{display:flex; min-height:100vh;}

  .sidebar{
    width:248px; flex:none;
    background:var(--sidebar);
    color:var(--sidebar-ink);
    display:flex; flex-direction:column;
    padding:20px 16px;
    position:sticky; top:0; height:100vh;
  }
  .nav-group{
    border:1px solid rgba(253,251,241,.12);
    border-radius:var(--radius-lg);
    padding:6px;
    display:flex; flex-direction:column; gap:2px;
    margin-bottom:14px;
  }
  .nav-solo{margin-bottom:14px;}
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:9px 10px;
    border-radius:var(--radius-md);
    text-decoration:none;
    color:var(--sidebar-ink);
    font-family:var(--font-display);
    font-size:13.5px; font-weight:500;
    cursor:pointer;
    border:1px solid transparent;
    background:transparent;
  }
  .nav-item .ic{width:16px; text-align:center; opacity:0.85; flex:none;}
  .nav-item:hover{background:var(--sidebar-hover);}
  .nav-item.active{
    background:var(--sidebar-active);
    color:var(--sidebar-active-ink);
    font-weight:600;
  }
  .nav-item.active .ic{opacity:1;}

  .sidebar-spacer{flex:1;}

  .user-block{
    position:relative;
    border-top:1px solid rgba(253,251,241,.12);
    padding-top:12px;
  }
  .user-row{
    display:flex; align-items:center; gap:9px; width:100%;
    padding:6px 8px; border-radius:var(--radius-md);
    border:none; background:transparent; cursor:pointer; text-align:left; font:inherit;
  }
  .user-row:hover, .user-row[aria-expanded="true"]{background:var(--sidebar-hover);}
  .user-avatar{
    width:30px; height:30px; border-radius:9px;
    background:var(--accent); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-size:11.5px; font-weight:600; flex:none;
  }
  .user-name{font-family:var(--font-display); font-size:13px; font-weight:600; color:#fff;}
  .user-role{font-size:11px; color:var(--sidebar-muted);}

  /* Account popover — opens above the sidebar trigger, notch pointing back at it */
  .profile-popover{
    position:absolute; left:8px; bottom:calc(100% + 10px); width:266px;
    z-index:60; opacity:0; transform:translateY(6px) scale(.98); pointer-events:none;
    transition:opacity .14s ease, transform .14s ease;
  }
  .profile-popover.open{opacity:1; transform:translateY(0) scale(1); pointer-events:auto;}
  .popover-panel{
    background:var(--surface); border-radius:var(--radius-lg); box-shadow:var(--shadow-e3);
    overflow:hidden;
  }
  .popover-notch{
    position:absolute; bottom:-6px; left:23px; width:12px; height:12px;
    background:var(--surface); transform:rotate(45deg); border-radius:2px;
    box-shadow:2px 2px 3px rgba(2,56,25,.06);
  }
  .popover-header{display:flex; align-items:center; gap:12px; padding:18px 18px 16px;}
  .popover-avatar{
    width:44px; height:44px; border-radius:50%; flex:none;
    background:var(--accent); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:600; font-size:15px;
  }
  .popover-name{font-family:var(--font-display); font-weight:600; font-size:15px; color:var(--ink);}
  .popover-role{font-size:12.5px; color:var(--muted); margin-top:1px;}
  .popover-divider{height:1px; background:var(--border);}
  .popover-item{
    display:flex; align-items:center; gap:12px; padding:14px 18px;
    font-size:14px; font-weight:500; color:var(--ink); text-decoration:none; cursor:pointer;
  }
  .popover-item:hover{background:var(--surface-2);}
  .popover-item .popover-ic{display:inline-flex; color:var(--muted); flex:none;}
  .popover-item.danger{color:var(--red-ink);}
  .popover-item.danger .popover-ic{color:var(--red-dot);}
  .popover-item.danger:hover{background:var(--red-bg);}

  /* Main */
  .main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 32px; border-bottom:1px solid var(--border);
    background:var(--surface);
    position:sticky; top:0; z-index:5;
  }
  .crumb{font-size:12px; color:var(--muted);}
  .page-title{font-size:19px; font-weight:700; margin-top:2px; letter-spacing:-0.01em;}
  .topbar-right{display:flex; align-items:center; gap:10px;}

  .content{padding:28px 32px 56px 32px; max-width:1180px; width:100%;}

  /* Buttons — Accent (lime, primary), Outline (default, inverts on hover), Ghost (text-only) */
  .btn{
    display:inline-flex; align-items:center; gap:6px;
    padding:10px 16px; border-radius:var(--radius-md);
    font-family:var(--font-display); font-size:13.5px; font-weight:600;
    border:1.5px solid var(--border-strong);
    background:var(--surface); color:var(--ink);
    cursor:pointer; white-space:nowrap; transition:.16s;
  }
  .btn:hover{background:var(--brand-fill); color:var(--accent); border-color:var(--brand-fill);}
  .btn-primary{
    background:var(--accent); border:none; color:var(--accent-ink);
  }
  .btn-primary:hover{background:var(--accent-strong); color:var(--accent-ink);}
  .btn-ghost{border-color:transparent; background:transparent;}
  .btn-ghost:hover{background:var(--surface-2); color:var(--ink); border-color:transparent;}
  .btn-danger{background:var(--red-dot); border:none; color:#fff;}
  .btn-danger:hover{background:var(--red-ink); color:#fff;}
  .btn:disabled{opacity:.5; cursor:not-allowed; pointer-events:none;}
  .btn-sm{padding:7px 11px; font-size:12.5px;}
  .btn:focus-visible, .nav-item:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .table-row:focus-visible{
    outline:2px solid var(--accent-strong); outline-offset:1px;
  }

  /* Cards / panels */
  .panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-xl);
    box-shadow:var(--shadow-e1);
  }
  .panel-pad{padding:20px;}

  .tiles{
    display:grid; grid-template-columns:repeat(5,1fr); gap:14px;
    margin-bottom:22px;
  }
  .tile{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-xl);
    padding:16px 18px; box-shadow:var(--shadow-e2);
  }
  .tile-label{font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; font-weight:600;}
  .tile-value{font-family:var(--font-display); font-size:26px; font-weight:600; margin-top:8px; letter-spacing:-0.01em; color:var(--ink);}
  .tile-sub{font-size:12px; color:var(--muted); margin-top:4px;}
  .tile-accent{border-top:3px solid var(--accent);}
  .tile-green{border-top:3px solid var(--green-dot);}

  .section-head{
    display:flex; align-items:baseline; justify-content:space-between;
    margin:26px 0 12px 0;
  }
  .section-head h2{font-size:14.5px; font-weight:600;}
  .section-head .link{font-size:12.5px; color:var(--ink-soft); cursor:pointer; text-decoration:underline; text-decoration-color:var(--border-strong); text-underline-offset:3px;}

  /* Toolbar */
  .toolbar{
    display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap;
  }
  .search{
    flex:1; min-width:220px;
    display:flex; align-items:center; gap:8px;
    border-radius:var(--radius-md);
    padding:9px 12px; background:var(--tint);
  }
  .search input{border:none; outline:none; background:transparent; font-size:13.5px; color:var(--tint-ink); width:100%; font-family:inherit;}
  .search input::placeholder{color:var(--ink-soft); opacity:.75;}
  .search .ic{color:var(--ink-soft); font-size:13px;}
  select.filter{
    border:1.5px solid var(--input-border); border-radius:var(--radius-md);
    padding:8px 10px; background:var(--surface); color:var(--ink);
    font-size:13px; font-family:inherit; cursor:pointer;
  }

  /* Table */
  .table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius-lg); background:var(--surface); box-shadow:var(--shadow-e1);}
  table{width:100%; border-collapse:collapse; min-width:720px;}
  thead th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.04em;
    color:var(--muted); font-weight:700; padding:11px 16px; border-bottom:1px solid var(--border);
    background:var(--surface-2);
  }
  tbody td{padding:13px 16px; border-bottom:1px solid var(--border); font-size:13.5px; vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  .table-row{cursor:pointer;}
  .table-row:hover{background:var(--surface-2);}
  .id-link{font-family:var(--font-display); font-weight:600; color:var(--ink); font-size:13px;}
  .chevron{color:var(--muted); text-align:right;}
  .empty-row td{padding:36px 16px; text-align:center; color:var(--muted);}

  .pagination{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    flex-wrap:wrap; padding:14px 2px 0;
  }
  .pagination-info{font-size:12.5px; color:var(--muted);}
  .pagination-pages{display:flex; align-items:center; gap:6px;}
  .page-btn{
    min-width:32px; height:32px; padding:0 8px; border-radius:var(--radius-md);
    border:1.5px solid var(--input-border); background:var(--surface); color:var(--ink);
    font-family:var(--font-display); font-size:13px; font-weight:600; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .page-btn:hover{background:var(--surface-2);}
  .page-btn.active{background:var(--accent); border-color:var(--accent-strong); color:var(--accent-ink);}
  .page-btn:disabled{opacity:.4; cursor:not-allowed;}

  .badge{
    display:inline-flex; align-items:center; gap:6px;
    padding:5px 11px; border-radius:var(--radius-sm); font-size:12px; font-weight:700;
    white-space:nowrap;
  }
  .badge .dot{width:6px; height:6px; border-radius:50%; flex:none;}
  .badge-amber{background:var(--amber-bg); color:var(--amber-ink);} .badge-amber .dot{background:var(--amber-dot);}
  .badge-green{background:var(--green-bg); color:var(--green-ink);} .badge-green .dot{background:var(--green-dot);}
  .badge-grey{background:var(--grey-bg); color:var(--grey-ink);} .badge-grey .dot{background:var(--grey-dot);}
  .badge-lime{background:var(--lime-bg); color:var(--lime-ink);} .badge-lime .dot{background:var(--lime-dot);}
  .badge-red{background:var(--red-bg); color:var(--red-ink);} .badge-red .dot{background:var(--red-dot);}

  /* Readiness — 0-3 low (red), 4-6 building (gold), 7+ ready (green); never bare text */
  .readiness{font-family:var(--font-ui); font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px;}
  .readiness-low{background:var(--red-bg); color:var(--red-ink);}
  .readiness-building{background:var(--amber-bg); color:var(--amber-ink);}
  .readiness-ready{background:var(--green-bg); color:var(--green-ink);}

  /* Detail view */
  .detail-head{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:10px;
  }
  .detail-title{display:flex; align-items:center; gap:12px;}
  .detail-title h1{font-size:20px; font-weight:700;}
  .back-link{
    display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-soft);
    cursor:pointer; margin-bottom:14px;
  }
  .back-link:hover{color:var(--ink);}

  .detail-grid{display:grid; grid-template-columns:2fr 1fr; gap:18px; align-items:start;}
  @media (max-width:1180px){ .tiles{grid-template-columns:repeat(3,1fr);} }
  @media (max-width:900px){ .detail-grid{grid-template-columns:1fr;} .tiles{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:520px){ .tiles{grid-template-columns:1fr;} }

  .field-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px 24px;}
  .field-grid-4{grid-template-columns:repeat(4,1fr);}
  @media (max-width:1100px){ .field-grid-4{grid-template-columns:repeat(2,1fr);} }
  .field{display:flex; flex-direction:column; gap:4px;}
  .field-label{font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted); font-weight:600;}
  .field-value{font-size:14px; color:var(--ink);}
  .field-value.mono{font-family:var(--font-mono);}
  .field-span2{grid-column:1 / -1;}

  .divider{height:1px; background:var(--border); margin:18px 0;}

  .timeline{display:flex; flex-direction:column; gap:0;}
  .tl-item{display:flex; gap:12px; padding-bottom:18px; position:relative;}
  .tl-item:last-child{padding-bottom:0;}
  .tl-item::before{
    content:''; position:absolute; left:5px; top:16px; bottom:0; width:1px; background:var(--border);
  }
  .tl-item:last-child::before{display:none;}
  .tl-dot{width:11px; height:11px; border-radius:50%; background:var(--surface); border:2px solid var(--border-strong); flex:none; margin-top:2px; z-index:1;}
  .tl-dot.done{background:var(--green-dot); border-color:var(--green-dot);}
  .tl-dot.current{background:var(--accent); border-color:var(--accent-strong);}
  .tl-body .tl-label{font-size:13px; font-weight:600;}
  .tl-body .tl-meta{font-size:12px; color:var(--muted); margin-top:1px;}

  .stat-list{display:flex; flex-direction:column; gap:12px;}
  .stat-row{display:flex; align-items:center; justify-content:space-between; font-size:13px;}
  .stat-row .k{color:var(--muted);}
  .stat-row .v{font-weight:600; font-family:var(--font-mono);}

  /* Form — the notched floating label is the input foundation across text, select, textarea */
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px 20px;}
  .form-field{display:flex; flex-direction:column; gap:6px;}
  .form-field.span2{grid-column:1 / -1;}
  .field-notch{
    position:relative; display:block;
    border:1.5px solid var(--input-border); border-radius:var(--radius-md);
    padding:15px 14px; background:var(--surface); transition:.14s;
  }
  .field-notch:hover{border-color:var(--border-strong);}
  .field-notch:focus-within{
    border:2px solid var(--border-strong); padding:14.5px 13.5px;
    box-shadow:0 0 0 3px rgba(191,251,79,.4);
  }
  .field-notch-label{
    position:absolute; top:-8px; left:11px; background:var(--surface); padding:0 5px;
    font-size:11px; color:var(--muted); font-weight:600; white-space:nowrap;
  }
  .field-notch:focus-within .field-notch-label{color:var(--border-strong);}
  .field-notch input, .field-notch select, .field-notch textarea{
    border:none; outline:none; width:100%; background:transparent; padding:0;
    font-size:14px; font-family:var(--font-ui); color:var(--ink);
  }
  .field-notch textarea{resize:vertical; min-height:60px;}
  .field-notch select{

  function setActiveNav(prefix){
    document.querySelectorAll(".nav-item[data-route]").forEach(function(el){
      var r = el.getAttribute("data-route");
      el.classList.toggle("active", prefix.indexOf(r) === 0);
    });
  }
  function go(route){ location.hash = route; }

  function route(){
    var hash = location.hash || "#/dashboard";
    var parts = hash.replace("#/","").split("/");
    var page = parts[0];

    if(page === "dashboard"){ setActiveNav("#/dashboard"); closeRfqDrawer(); renderDashboard(); }
    else if(page === "rfq" && parts[1] === "new"){ setActiveNav("#/rfq"); renderRfqList(); openRfqFormDrawer(); }
    else if(page === "rfq" && parts[1] && parts[2] === "edit"){ setActiveNav("#/rfq"); renderRfqList(); openRfqFormDrawer(parts[1]); }
    else if(page === "rfq" && parts[1]){ setActiveNav("#/rfq"); renderRfqList(); openRfqDrawer(parts[1]); }
    else if(page === "rfq"){ setActiveNav("#/rfq"); closeRfqDrawer(); renderRfqList(); }
    else if(page === "quote" && parts[1]){ setActiveNav("#/quote"); closeRfqDrawer(); renderQuoteList(parts[1]); }
    else if(page === "quote"){ setActiveNav("#/quote"); closeRfqDrawer(); renderQuoteList(); }
    else if(page === "shipment" && parts[1]){ setActiveNav("#/shipment"); closeRfqDrawer(); renderShipmentDetail(parts[1]); }
    else if(page === "shipment"){ setActiveNav("#/shipment"); closeRfqDrawer(); renderShipmentList(); }
    else if(page === "profile"){ setActiveNav("#/profile"); closeRfqDrawer(); renderProfile(); }
    else { go("#/dashboard"); }

    content.scrollTop = 0;
    window.scrollTo(0,0);
  }
  window.addEventListener("hashchange", route);

  function renderRfqList(){
    setHeader("RFQ", "OnePort365 / RFQ", '<button class="btn btn-primary" data-route="#/rfq/new">+ New RFQ</button>');

    content.innerHTML =
      '<div class="toolbar">'+
        '<div class="search"><span class="ic">&#128269;</span><input id="rfqSearch" type="text" placeholder="Search by RFQ number" value="'+esc(rfqFilterState.q)+'"></div>'+
        '<select class="filter" id="rfqStatusFilter">'+

          '<th>RFQ Number</th><th>POL</th><th>POD</th><th>Status</th><th>Readiness</th><th></th>'+

    document.getElementById("rfqSearch").addEventListener("input", function(e){
      rfqFilterState.q = e.target.value; rfqFilterState.page = 1; paintRfqRows();
    });
    document.getElementById("rfqStatusFilter").addEventListener("change", function(e){
      rfqFilterState.status = e.target.value; rfqFilterState.page = 1; paintRfqRows();
    });

    paintRfqRows();
  }

  function paintRfqRows(){
    var tbody = document.getElementById("rfqTbody");
    var q = rfqFilterState.q.trim().toLowerCase();
    var filtered = DB.rfqs.slice().sort(function(a,b){ return b.id.localeCompare(a.id, undefined, {numeric:true}); }).filter(function(r){
      if(rfqFilterState.status !== "all" && r.status !== rfqFilterState.status) return false;
      if(!q) return true;
      return r.id.toLowerCase().indexOf(q) !== -1;
    });

    var totalPages = Math.max(1, Math.ceil(filtered.length / RFQ_PAGE_SIZE));
    if(rfqFilterState.page > totalPages) rfqFilterState.page = totalPages;
    if(rfqFilterState.page < 1) rfqFilterState.page = 1;
    var startIdx = (rfqFilterState.page - 1) * RFQ_PAGE_SIZE;
    var pageRows = filtered.slice(startIdx, startIdx + RFQ_PAGE_SIZE);

    if(filtered.length === 0){
      tbody.innerHTML = '<tr class="empty-row"><td colspan="6">No RFQs match this RFQ number.</td></tr>';
      paintRfqPagination(0, 1, 0, 0);
      return;
    }

    tbody.innerHTML = pageRows.map(function(r){
      var rd = readiness(r);
      var readyCls = "readiness-"+readinessTier(rd);
      return '<tr class="table-row" tabindex="0" data-route="#/rfq/'+esc(r.id)+'">'+
        '<td class="id-link">'+esc(r.id)+'</td>'+
        '<td class="num">'+esc(r.origin)+'</td>'+
        '<td class="num">'+esc(r.destination)+'</td>'+
        '<td>'+rfqStatusBadge(r.status)+'</td>'+
        '<td><span class="readiness '+readyCls+'">'+rd.n+'/'+rd.total+'</span></td>'+
        '<td class="chevron">&#8250;</td>'+
      '</tr>';
    }).join("");

    paintRfqPagination(filtered.length, totalPages, startIdx, pageRows.length);
  }

  function paintRfqPagination(totalItems, totalPages, startIdx, pageCount){
    var el = document.getElementById("rfqPagination");
    if(!el) return;
    if(totalItems === 0){ el.innerHTML = ""; return; }

    var page = rfqFilterState.page;
    var pageButtons = "";
    for(var i = 1; i <= totalPages; i++){
      pageButtons += '<button type="button" class="page-btn'+(i===page?" active":"")+'" data-page="'+i+'">'+i+'</button>';
    }

    el.innerHTML =
      '<div class="pagination-info">Showing '+(startIdx+1)+'–'+(startIdx+pageCount)+' of '+totalItems+'</div>'+
      '<div class="pagination-pages">'+
        '<button type="button" class="page-btn" id="rfqPagePrev" '+(page<=1?"disabled":"")+' aria-label="Previous page">&#8249;</button>'+
        pageButtons+
        '<button type="button" class="page-btn" id="rfqPageNext" '+(page>=totalPages?"disabled":"")+' aria-label="Next page">&#8250;</button>'+
      '</div>';

    document.getElementById("rfqPagePrev").addEventListener("click", function(){
      if(rfqFilterState.page > 1){ rfqFilterState.page -= 1; paintRfqRows(); }
    });
    document.getElementById("rfqPageNext").addEventListener("click", function(){
      if(rfqFilterState.page < totalPages){ rfqFilterState.page += 1; paintRfqRows(); }
    });
    el.querySelectorAll(".page-btn[data-page]").forEach(function(btn){
      btn.addEventListener("click", function(){
        rfqFilterState.page = parseInt(btn.getAttribute("data-page"), 10);
        paintRfqRows();
      });
    });
  }

  function openRfqDrawer(id){
    var r = findRfq(id);
    var backdrop = document.getElementById("rfqDrawerBackdrop");
    var drawer = document.getElementById("rfqDrawer");

    if(!r){
      drawer.innerHTML =
        '<div class="drawer-header"><div></div><button class="btn-icon" data-route="#/rfq" aria-label="Close">&times;</button></div>'+
        '<div class="drawer-body"><div class="empty-state"><div class="ic">&#9888;</div><div>This RFQ could not be found.</div></div></div>';
      backdrop.classList.add("open");
      drawer.classList.add("open");
      return;
    }

    var actions = "";
    if(r.status === "Awaiting Quote"){
      actions += '<button class="btn btn-sm" data-route="#/rfq/'+esc(r.id)+'/edit">Edit</button>';
      actions += '<button class="btn btn-sm btn-primary" id="drawerSendBtn">Send RFQ</button>';
    }

    drawer.innerHTML =
      '<div class="drawer-header">'+
        '<h2>'+esc(r.id)+'</h2>'+
        '<div class="drawer-actions">'+rfqStatusBadge(r.status)+actions+'<button class="btn-icon" data-route="#/rfq" aria-label="Close">&times;</button></div>'+
      '</div>'+
      '<div class="drawer-body">'+
        modalRow("Freight Type", r.freightType ? '<span class="badge-tint">'+esc(r.freightType)+'</span>' : "", true)+

        modalRow("Origin (POL)", r.origin ? esc(r.origin)+" — "+esc(PORTS[r.origin]||"") : "")+
        modalRow("Destination (POD)", r.destination ? esc(r.destination)+" — "+esc(PORTS[r.destination]||"") : "")+
        modalRow("Container Type", r.containerType)+
        modalRow("Quantity", r.quantity)+
        modalRow("Cargo Weight", r.cargoWeight)+
        modalRow("Target Shipment Date", r.targetDate ? fmtDate(r.targetDate) : "")+
        modalRow("Cargo Description", r.cargoDescription)+
        modalRow("Notes", r.notes)+
      '</div>';

    var sendBtn = document.getElementById("drawerSendBtn");
    if(sendBtn) sendBtn.addEventListener("click", function(){
      var rd = readiness(r);

        return;
      }
      r.status = "Sent";
      saveState();
      showToast(r.id+" sent.");
      openRfqDrawer(r.id);
    });

    backdrop.classList.add("open");
    drawer.classList.add("open");

  /* ---------- New RFQ Form (modal) ---------- */
  function openRfqFormDrawer(editId){
    var editing = editId ? findRfq(editId) : null;
    var draft = editing ? editing : {
      freightType:"", origin:"", destination:"", cargoDescription:"",
      cargoWeight:"", containerType:"", quantity:"", incoterm:"", targetDate:"", notes:""
    };

    var backdrop = document.getElementById("rfqDrawerBackdrop");
    var drawer = document.getElementById("rfqDrawer");

    drawer.innerHTML =
      '<div class="drawer-header">'+
        '<h2>'+(editing ? "Edit "+esc(editing.id) : "New RFQ")+'</h2>'+
        '<button class="btn-icon" data-route="'+(editing?"#/rfq/"+editing.id:"#/rfq")+'" aria-label="Close">&times;</button>'+

        '<div class="drawer-body">'+
          '<div class="form-grid">'+

            notchSelect("f_freightType", "Freight Type", optionList(FREIGHT_TYPES, draft.freightType, "Select freight type"))+
            notchSelect("f_incoterm", "Incoterm", optionList(INCOTERMS, draft.incoterm, "Select incoterm"))+

            notchSelect("f_origin", "Origin (Port of Loading)", portOptionList(draft.origin))+
            notchSelect("f_destination", "Destination (Port of Discharge)", portOptionList(draft.destination))+

            notchInput("f_cargoDescription", "Cargo Description", draft.cargoDescription, "e.g. Frozen poultry parts", "text", true)+

            notchInput("f_cargoWeight", "Cargo Weight (with units)", draft.cargoWeight, "e.g. 18,000 kg")+
            notchInput("f_quantity", "Quantity", draft.quantity, "e.g. 2 containers")+

            notchSelect("f_containerType", "Container Type", optionList(CONTAINER_TYPES, draft.containerType, "Select container type"))+
            notchInput("f_targetDate", "Target Shipment Date", draft.targetDate, "", "date")+

            notchTextarea("f_notes", "Notes (optional)", draft.notes, "Handling instructions, certifications, special requirements...", true)+

          '</div>'+
        '</div>'+
        '<div class="drawer-footer">'+
          '<div class="progress-mini">Readiness: <b id="readinessLabel">0/9</b> required fields complete</div>'+
          '<div style="display:flex; gap:10px;">'+
            '<button type="button" class="btn btn-sm" id="saveDraftBtn">Save &amp; finish later</button>'+

          '</div>'+
        '</div>'+
      '</form>';

    backdrop.classList.add("open");
    drawer.classList.add("open");

    function collect(){
      return {
        freightType: document.getElementById("f_freightType").value,
        incoterm: document.getElementById("f_incoterm").value,
        origin: document.getElementById("f_origin").value,
        destination: document.getElementById("f_destination").value,
        cargoDescription: document.getElementById("f_cargoDescription").value.trim(),
        cargoWeight: document.getElementById("f_cargoWeight").value.trim(),
        quantity: document.getElementById("f_quantity").value.trim(),
        containerType: document.getElementById("f_containerType").value,
        targetDate: document.getElementById("f_targetDate").value,
        notes: document.getElementById("f_notes").value.trim()
      };
    }
    function updateReadiness(){
      var vals = collect();
      var rd = readiness(vals);
      document.getElementById("readinessLabel").textContent = rd.n+"/"+rd.total;
    }
    ["f_freightType","f_incoterm","f_origin","f_destination","f_cargoDescription","f_cargoWeight","f_quantity","f_containerType","f_targetDate","f_notes"].forEach(function(id){
      var el = document.getElementById(id);
      el.addEventListener("input", updateReadiness);
      el.addEventListener("change", updateReadiness);
    });
    updateReadiness();

    document.getElementById("saveDraftBtn").addEventListener("click", function(){
      persist("Awaiting Quote");
    });
    document.getElementById("rfqForm").addEventListener("submit", function(e){
      e.preventDefault();
      var vals = collect();
      var rd = readiness(vals);
      if(rd.n < rd.total){
        showToast("Complete all required fields to send ("+rd.n+"/"+rd.total+" done). Saved for later instead.");
        persist("Awaiting Quote");
        return;
      }
      persist("Sent");
    });

    function persist(status){
      var vals = collect();
      if(editing){
        Object.assign(editing, vals);
        editing.status = status;
        saveState();
        showToast(editing.id+" "+(status==="Awaiting Quote"?"saved. Finish it later from the RFQ list.":"sent."));
        go("#/rfq/"+editing.id);
      } else {
        var id = "RFQ-"+DB.nextRfq;
        DB.nextRfq += 1;
        var record = Object.assign({id:id, status:status, created:new Date().toISOString()}, vals);
        DB.rfqs.unshift(record);
        saveState();
        showToast(id+" "+(status==="Awaiting Quote"?"saved. Finish it later from the RFQ list.":"created and sent."));
        go("#/rfq/"+id);
      }
    }
  }

  function optionList(list, selected, placeholder){
    var html = '<option value="" '+(selected?"":"selected")+' disabled>'+esc(placeholder)+'</option>';
    list.forEach(function(v){
      html += '<option value="'+esc(v)+'" '+(v===selected?"selected":"")+'>'+esc(v)+'</option>';
    });
    return html;
  }
  function portOptionList(selected){
    var html = '<option value="" '+(selected?"":"selected")+' disabled>Select a port</option>';
    PORT_LIST.forEach(function(p){
      html += '<option value="'+esc(p.code)+'" '+(p.code===selected?"selected":"")+'>'+esc(p.label)+'</option>';
    });
    return html;
  }

  /* ---------- Quote List / Detail ---------- */
  var quoteFilterState = { tab:"all" };
  var selectedQuoteId = null;

  function renderQuoteList(selectedId){
    setHeader("Quote", "OnePort365 / Quote", "");

    var all = DB.quotes.slice().sort(function(a,b){ return new Date(b.created) - new Date(a.created); });
    var filtered = all.filter(function(q){
      if(quoteFilterState.tab === "pending") return q.status === "Pending";
      if(quoteFilterState.tab === "accepted") return q.status === "Accepted";
      if(quoteFilterState.tab === "declined") return q.status === "Declined";
      return true;
    });
    // Nothing is shown until a quote is explicitly clicked or linked to directly —
    // no auto-selecting the first row on load or when switching tabs.
    var activeId = selectedId || null;
    selectedQuoteId = activeId;

    var tabs = [["all","All"],["pending","Pending"],["accepted","Accepted"],["declined","Declined"]];

    content.innerHTML =
      '<div class="quote-shell">'+
        '<div class="quote-list-pane">'+
          '<div class="quote-list-head"><div class="quote-list-title">All Quotes</div></div>'+
          '<div class="quote-tabs">'+
            tabs.map(function(t){
              return '<span class="quote-tab'+(quoteFilterState.tab===t[0]?" active":"")+'" data-tab="'+t[0]+'">'+t[1]+'</span>';
            }).join("")+
          '</div>'+
          '<div class="quote-cards">'+
            (filtered.length ? filtered.map(function(q){
              var rfq = findRfq(q.rfqId);
              return '<div class="quote-card'+(q.id===activeId?" active":"")+'" data-qid="'+esc(q.id)+'">'+
                '<div class="quote-card-top"><span class="quote-card-id">'+esc(q.id)+'</span>'+quoteStatusBadge(q.status)+'</div>'+
                '<div class="quote-card-name">'+esc(CUSTOMER)+'</div>'+
                '<div class="quote-card-route">'+(rfq ? esc(portShort(rfq.origin)+" → "+portShort(rfq.destination)) : "—")+'</div>'+
                '<div class="quote-card-date">'+fmtDate(q.issuedDate)+'</div>'+
              '</div>';
            }).join("") : '<div class="empty-state" style="padding:36px 18px;"><div class="ic">&#128179;</div><div>No quotes in this view.</div></div>')+
          '</div>'+
        '</div>'+
        '<div class="quote-detail-pane" id="quoteDetailPane"></div>'+
      '</div>';

    document.querySelectorAll(".quote-tab").forEach(function(el){
      el.addEventListener("click", function(){
        quoteFilterState.tab = el.getAttribute("data-tab");
        renderQuoteList();
      });
    });
    document.querySelectorAll(".quote-card").forEach(function(el){
      el.addEventListener("click", function(){
        var qid = el.getAttribute("data-qid");
        selectedQuoteId = qid;
        history.replaceState(null, "", "#/quote/"+qid);
        document.querySelectorAll(".quote-card").forEach(function(c){
          c.classList.toggle("active", c.getAttribute("data-qid") === qid);
        });
        renderQuoteDetailPane(qid);
      });
    });

    renderQuoteDetailPane(activeId);
  }

  function portShort(code){ return code || "—"; }

      pane.innerHTML = '<div class="empty-state" style="height:100%;"><div class="ic">&#128179;</div><div>Select a quote to view details.</div></div>';

    }

    var qty = parseQty(rfq ? rfq.quantity : "1");
    var originCharges = defaultOriginCharges(qty);
    var originSubtotal = originCharges.reduce(function(a,c){ return a + c.sell; }, 0);
    var freightTitle = rfq ? rfq.freightType : "Freight";

    var headerActions = "";
    if(q.status === "Pending"){
      headerActions = '<button class="btn btn-primary btn-sm" id="acceptQuoteBtn">Accept Quote</button>'+

    }

    pane.innerHTML =
      '<div class="quote-doc-top">'+
        '<div>'+
          '<div class="quote-doc-title">'+esc(q.id)+'</div>'+
          '<div class="quote-doc-sub">'+esc(CUSTOMER)+(rfq ? " · "+esc(PORTS[rfq.origin]||rfq.origin)+" → "+esc(PORTS[rfq.destination]||rfq.destination) : "")+'</div>'+
        '</div>'+
        '<div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">'+
          quoteStatusBadge(q.status)+headerActions+
          '<button class="btn btn-sm" id="quotePdfBtn"><span style="margin-right:5px;">&#128196;</span>PDF</button>'+
        '</div>'+
      '</div>'+
      '<div class="quote-doc">'+

        (q.status === "Declined" ? (
          '<div class="doc-note"><span class="ic">&#9888;</span><div><b>Declined'+(q.declineReason?": "+esc(q.declineReason):"")+'.</b>'+(q.declineNote?" "+esc(q.declineNote):"")+'</div></div>'
        ) : "")+

        '<div class="quote-letterhead">'+
          '<div>'+
            '<div class="quote-brand"><span style="color:var(--ink)">OnePort</span><span style="color:var(--accent-strong)">365</span></div>'+
            '<div class="quote-address">25 Marina Street, Lagos Island<br>Lagos, Nigeria</div>'+
          '</div>'+
          '<div class="quote-meta-right">'+
            '<div class="quote-doc-id">'+esc(q.id)+'</div>'+
            '<div class="quote-doc-issued">Issued: '+fmtDate(q.issuedDate)+'</div>'+
            '<div class="quote-doc-valid">Valid for '+q.validDays+' day'+(q.validDays===1?"":"s")+'</div>'+
          '</div>'+
        '</div>'+

        '<div class="collapsible" id="bookingDetailsBlock">'+
          '<div class="collapsible-head" id="bookingDetailsToggle"><h3>Booking Details</h3><span class="collapsible-chevron">&#9662;</span></div>'+
          '<div class="collapsible-body">'+
            '<div class="field-grid field-grid-4">'+
              field("Company Name", CUSTOMER)+
              field("Customer Name", "Okpanaci")+
              field("Email Address", "okpanaci@adaezefoods.example")+
              field("Commodity", rfq ? rfq.cargoDescription : "")+
              field("Service Type", rfq ? serviceTypeLabel(rfq) : "")+
              field("Port of Loading", rfq ? portLabel(rfq.origin) : "")+
              field("Destination Port", rfq ? portLabel(rfq.destination) : "")+
              field("Container Size", rfq ? containerSizeLabel(rfq) : "")+
            '</div>'+
          '</div>'+
        '</div>'+

        '<div class="section-title">'+esc(freightTitle)+'</div>'+
        '<div class="table-wrap doc-table-wrap"><table><thead><tr>'+
          '<th>Carrier</th><th>Route</th><th>Equip</th><th>Unit</th><th>Transit</th><th>Free Days</th><th>Sell</th>'+
        '</tr></thead><tbody><tr>'+
          '<td>'+esc(q.carrier)+'</td>'+
          '<td class="num">'+(rfq ? esc(rfq.origin+" → "+rfq.destination) : "—")+'</td>'+
          '<td>'+esc(q.equip)+'</td>'+
          '<td class="num">'+esc(q.unit)+'</td>'+
          '<td class="num">'+q.transitDays+' days</td>'+
          '<td class="num">'+(q.freeDays != null ? q.freeDays+' days' : "—")+'</td>'+
          '<td class="num" style="font-weight:700; color:var(--ink);">'+fmtUSD(q.freightSell)+'</td>'+
        '</tr></tbody></table></div>'+
        '<div class="doc-subtotal">Sub Total: <b>'+fmtUSD(q.freightSell)+'</b></div>'+

        '<div class="section-title">Origin Charges</div>'+
        '<div class="table-wrap doc-table-wrap"><table><thead><tr>'+
          '<th>Basis</th><th>Qty</th><th>Description</th><th>Sell</th>'+
        '</tr></thead><tbody>'+
          originCharges.map(function(c){
            return '<tr><td>'+esc(c.basis)+'</td><td class="num">'+c.qty+'</td><td>'+esc(c.description)+'</td>'+
              '<td class="num" style="font-weight:700; color:var(--ink);">'+fmtNaira(c.sell)+'</td></tr>';
          }).join("")+
        '</tbody></table></div>'+
        '<div class="doc-subtotal">Sub Total: <b>'+fmtNaira(originSubtotal)+'</b></div>'+

        '<div class="doc-note"><span class="ic">&#9888;</span><div><b>Note:</b> Duty and tax advised are subject to verification and assessment by NCS upon arrival of cargo. 7.5% VAT will be applicable at the time of invoicing. Please note this offer is firm for acceptance within 48 hours, otherwise the above offer will be considered invalid. Storage / detention / demurrage charges (if any) are as per receipt.</div></div>'+

        '<div class="section-title">OnePort365 Terms and Conditions</div>'+
        '<div class="doc-terms"><ol>'+
          TERMS_AND_CONDITIONS.map(function(t){ return '<li>'+esc(t)+'</li>'; }).join("")+
        '</ol></div>'+

      '</div>';

    document.getElementById("bookingDetailsToggle").addEventListener("click", function(){
      document.getElementById("bookingDetailsBlock").classList.toggle("collapsed");
    });
    document.getElementById("quotePdfBtn").addEventListener("click", function(){
      showToast("PDF export isn't wired up in this prototype.");
    });

    var acceptBtn = document.getElementById("acceptQuoteBtn");
    if(acceptBtn) acceptBtn.addEventListener("click", function(){
      q.status = "Accepted";
      var newShip = {
        id: "SHP-"+(2200+DB.shipments.length+10), quoteId:q.id, rfqId:q.rfqId,
        mode:q.carrier+" — "+(rfq?rfq.freightType:""),
        lane: rfq ? (rfq.origin+" → "+rfq.destination) : "—",
        carrier:q.carrier,
        ref: q.carrier.replace(/\s+/g,"").toUpperCase()+"-"+Math.floor(100000+Math.random()*899999),
        etd:"", eta:"", status:"Booked",
        milestones:[
          {label:"Booking confirmed", date:new Date().toISOString().slice(0,10), done:true, current:true},
          {label:"Cargo received at origin", date:"", done:false},
          {label:"Departed origin", date:"", done:false},
          {label:"In transit", date:"", done:false},
          {label:"Arrived destination", date:"", done:false},
          {label:"Delivered", date:"", done:false}

      DB.shipments.unshift(newShip);

    if(declineBtn) declineBtn.addEventListener("click", function(){ openDeclineModal(q.id); });

  /* ---------- Decline quote modal ---------- */
  function openDeclineModal(qid){
    var backdrop = document.getElementById("declineBackdrop");
    var modal = document.getElementById("declineModal");
    modal.innerHTML =
      '<div class="drawer-header"><h2>Decline Quote</h2><button class="btn-icon" id="declineCloseX" aria-label="Close">&times;</button></div>'+
      '<div class="drawer-body">'+
        '<p style="font-size:13px; color:var(--ink-soft); margin:0 0 18px;">Let us know why you\'re declining <b>'+esc(qid)+'</b> so our commercial team can follow up.</p>'+
        '<div class="form-field">'+
          '<label class="field-notch"><span class="field-notch-label">Reason</span>'+
            '<select id="declineReasonSelect">'+
              '<option value="" selected disabled>Select a reason</option>'+
              '<option>Price too high</option>'+
              '<option>Transit time too long</option>'+
              '<option>No longer needed</option>'+
              '<option>Other</option>'+
            '</select>'+
          '</label>'+
        '</div>'+
        '<div class="form-field" style="margin-top:16px;">'+
          '<label class="field-notch"><span class="field-notch-label">Additional note (optional)</span>'+
            '<textarea id="declineNoteInput" placeholder="Anything else we should know?"></textarea>'+
          '</label>'+
        '</div>'+
      '</div>'+
      '<div style="display:flex; justify-content:flex-end; gap:10px; padding:16px 22px; border-top:1px solid var(--border); flex:none;">'+
        '<button class="btn btn-sm" id="declineCancelBtn">Cancel</button>'+
        '<button class="btn btn-sm btn-danger" id="declineConfirmBtn" disabled>Confirm Decline</button>'+
      '</div>';

    document.getElementById("declineReasonSelect").addEventListener("change", function(e){
      document.getElementById("declineConfirmBtn").disabled = !e.target.value;
    });
    document.getElementById("declineCloseX").addEventListener("click", closeDeclineModal);
    document.getElementById("declineCancelBtn").addEventListener("click", closeDeclineModal);
    document.getElementById("declineConfirmBtn").addEventListener("click", function(){
      var q = findQuote(qid);
      if(!q) return;
      q.status = "Declined";
      q.declineReason = document.getElementById("declineReasonSelect").value;
      q.declineNote = document.getElementById("declineNoteInput").value.trim();
      saveState();
      closeDeclineModal();
      showToast(qid+" declined.");
      renderQuoteList(qid);
    });

    backdrop.classList.add("open");
    modal.classList.add("open");
  }
  function closeDeclineModal(){
    document.getElementById("declineBackdrop").classList.remove("open");
    document.getElementById("declineModal").classList.remove("open");
  }

  /* ---------- Shipment List / Detail ---------- */
  function renderShipmentList(){
    setHeader("Shipment", "OnePort365 / Shipment", "");
    var rows = DB.shipments.slice().sort(function(a,b){ return b.id.localeCompare(a.id, undefined, {numeric:true}); });

      '<div class="table-wrap"><table>'+
        '<thead><tr><th>Shipment</th><th>Lane</th><th>Carrier</th><th>ETD</th><th>ETA</th><th>Status</th><th></th></tr></thead>'+
        '<tbody>'+
        (rows.length ? rows.map(function(s){
          return '<tr class="table-row" tabindex="0" data-route="#/shipment/'+esc(s.id)+'">'+
            '<td class="id-link">'+esc(s.id)+'</td>'+
            '<td class="num">'+esc(s.lane)+'</td>'+
            '<td>'+esc(s.carrier)+'</td>'+
            '<td class="num">'+fmtDate(s.etd)+'</td>'+
            '<td class="num">'+fmtDate(s.eta)+'</td>'+
            '<td>'+shipmentStatusBadge(s.status)+'</td>'+
            '<td class="chevron">&#8250;</td>'+
          '</tr>';

        '</tbody>'+
      '</table></div>';

        '<div class="panel panel-pad">'+

            field("Lane", s.lane)+

            field("ETD", fmtDate(s.etd))+

            '<div class="timeline">'+
              s.milestones.map(function(m){
                return '<div class="tl-item"><div class="tl-dot '+(m.current?"current":(m.done?"done":""))+'"></div>'+

              '<div class="section-head" style="margin:0 0 12px 0;"><h2>Origin RFQ</h2></div>'+
              '<div class="stat-list">'+ statRow("RFQ", rfq.id) + statRow("Cargo", rfq.cargoDescription) +'</div>'+

  /* ---------- Boot ---------- */
  document.getElementById("sidebarCompany").textContent = CUSTOMER;
